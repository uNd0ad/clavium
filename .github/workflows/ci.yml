name: CI

on:
  push:
    branches: [dev, prod]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clavium
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clavium
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/clavium
      # Testele rulează într-o schemă izolată, ca în local.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clavium?schema=clavium_test
      JWT_SECRET: ci_secret_used_only_for_build_0123456789abcdef

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: |
          npx prisma migrate deploy
          npm run build
