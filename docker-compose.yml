# Postgres local pentru dezvoltare. Pornește cu: docker compose up -d
# Conectează apoi DATABASE_URL la: postgresql://clavium:clavium@localhost:5432/clavium
services:
  db:
    image: postgres:16-alpine
    container_name: clavium-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: clavium
      POSTGRES_PASSWORD: clavium
      POSTGRES_DB: clavium
    ports:
      - '5432:5432'
    volumes:
      - clavium-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U clavium -d clavium']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  clavium-pgdata:
